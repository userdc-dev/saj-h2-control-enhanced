preview_mode_change:
  name: Preview inverter operating mode change
  description: >-
    Re-read the live SAJ H2 inverter twice and report whether switching to
    Self-consumption or Time-of-Use would be safe to propose. This service
    NEVER writes a register. It returns the result in Developer Tools > Actions.
  fields:
    target_mode:
      name: Target operating mode
      description: Which operating mode to check (does not activate it).
      required: true
      selector:
        select:
          options:
            - label: Self-consumption
              value: self_consumption
            - label: Time-of-Use
              value: time_of_use
    entry_id:
      name: Integration entry ID
      description: Optional, required only when multiple SAJ control entries exist.
      required: false
      selector:
        text:

supervised_tou_pilot:
  name: Supervised one-time Time-of-Use switch (LIVE WRITE)
  description: >-
    DANGER: Sends one real Modbus function-06 operating-mode write (0x3647=1)
    only when the current mode is Self-consumption, the active schedule masks
    are both 1 and the full schedule readback remains unchanged. Requires
    explicit confirmation each time. Never invoked by dashboard automatically.
    eLEKeeper or a VPP may later override this change.
  fields:
    confirmation:
      name: Exact confirmation phrase
      description: Type I AUTHORIZE ONE TOU MODE WRITE
      required: true
      selector:
        text:
    expected_current_mode:
      name: Expected current mode
      description: Enter 0 (Self-consumption).
      required: true
      selector:
        number:
          min: 0
          max: 0
          step: 1
    device_model:
      name: Verified inverter model
      description: H2-10K-S3-A
      required: true
      selector:
        text:
    control_firmware:
      name: Verified control-board firmware
      description: v2.018
      required: true
      selector:
        text:
    entry_id:
      name: Control integration entry ID
      required: false
      selector:
        text:

supervised_self_consumption_pilot:
  name: Supervised one-time Self-consumption switch (LIVE WRITE)
  description: >-
    Sends exactly one Modbus function-06 operating-mode write (0x3647=0)
    only if current mode is Time-of-Use (1) and the owner-verified charge
    and discharge schedules have not changed. Requires explicit confirmation.
    Never retries or automatically rolls back. eLEKeeper may take minutes
    to update and a former VPP controller could override the mode later.
  fields:
    confirmation:
      name: Exact confirmation phrase
      description: Type I AUTHORIZE ONE SELF CONSUMPTION MODE WRITE
      required: true
      selector:
        text:
    device_model:
      name: Verified inverter model
      description: H2-10K-S3-A
      required: true
      selector:
        text:
    control_firmware:
      name: Verified control-board firmware
      description: v2.018
      required: true
      selector:
        text:
    entry_id:
      name: Control integration entry ID
      description: Optional unless multiple control integrations exist.
      required: false
      selector:
        text:

preview_schedule_change:
  name: Validate schedule draft (NO WRITE)
  description: >-
    Compare one existing charge or discharge slot with a fresh double-read
    from inverter, validate 24-hour times, Monday-Friday day masks and raw
    power percent, and return proposed Modbus words. NEVER writes to inverter.
    New slots, deleted slots, weekends and overnight periods are not yet supported.
  fields:
    direction:
      name: Direction
      required: true
      selector:
        select:
          options:
            - charge
            - discharge
    slot:
      name: Slot number (1–7)
      required: true
      selector:
        number:
          min: 1
          max: 7
          step: 1
    expected_start:
      name: Previously read start HH:MM
      required: true
      selector:
        text:
    expected_end:
      name: Previously read end HH:MM
      required: true
      selector:
        text:
    expected_day_mask:
      name: Previously read weekday mask
      required: true
      selector:
        number:
          min: 0
          max: 127
          step: 1
    expected_power_percent:
      name: Previously read raw power percent
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
    start:
      name: Proposed start HH:MM
      required: true
      selector:
        text:
    end:
      name: Proposed end HH:MM
      required: true
      selector:
        text:
    weekdays:
      name: Proposed weekdays
      required: true
      selector:
        select:
          multiple: true
          options:
            - Mon
            - Tue
            - Wed
            - Thu
            - Fri
    power_percent:
      name: Proposed raw power percent
      required: true
      selector:
        number:
          min: 1
          max: 100
          step: 1
    entry_id:
      name: Optional SAJ TOU control entry
      required: false
      selector:
        text:

supervised_friday_charge_time_pilot:
  name: Supervised Friday charging-time test (LIVE WRITE)
  description: >-
    ONE-TIME LIVE TEST ONLY, not general schedule editing.
    Requires current Self-consumption mode (0), fallback 1, charging
    Friday 22:00-22:40 at raw70 (6930 W), discharging Wednesday
    22:00-22:40 at raw50 (4950 W), and masks [1,1].
    Sends two individually verified Modbus single-register writes to
    0x3606=21:30 and 0x3607=22:00; weekdays/power/discharge untouched.
    Interrupted operation may leave a partially changed window. No automatic
    retry/rollback. Keep eLEKeeper open for manual recovery.
  fields:
    confirmation:
      name: Exact confirmation phrase
      description: Type I AUTHORIZE FRIDAY CHARGE TIME TEST
      required: true
      selector:
        text:
    device_model:
      name: Verified inverter model
      required: true
      selector:
        text:
    control_firmware:
      name: Verified control firmware
      required: true
      selector:
        text:
    entry_id:
      name: Optional SAJ TOU integration entry ID
      required: false
      selector:
        text:

plan_schedules:
  name: Validate entire TOU schedule draft (NO WRITE)
  description: >-
    Check all enabled charge and discharge slots against a fresh complete
    device double-read; return exact register changes. No Modbus writes.
  fields:
    expected_charge:
      name: Original enabled charging slots
      required: true
      selector:
        object:
    expected_discharge:
      name: Original enabled discharging slots
      required: true
      selector:
        object:
    proposed_charge:
      name: Proposed charging slots (up to 7)
      required: true
      selector:
        object:
    proposed_discharge:
      name: Proposed discharging slots (up to 7)
      required: true
      selector:
        object:
    entry_id:
      name: Optional control integration entry
      required: false
      selector:
        text:

apply_schedules:
  name: Apply complete TOU schedules (LIVE WRITE)
  description: >-
    Real inverter control. Only while in Self-consumption mode. Requires
    exact confirmation, complete two-block preflight, then writes only
    differing register words individually with a complete double-read after
    each write. Editing, adding and disabling up to seven slots per direction
    supported for Monday-Friday, non-overnight periods. Weekends and overnight
    writes remain blocked until verified on this inverter. Multiple writes
    are not atomic: on error, partial schedules may remain. No auto retry
    or rollback. Recheck in eLEKeeper.
  fields:
    confirmation:
      name: Exact authorization
      description: I AUTHORIZE TOU SCHEDULE CHANGES
      required: true
      selector:
        text:
    device_model:
      name: Verified inverter
      required: true
      selector:
        text:
    control_firmware:
      name: Verified control firmware
      required: true
      selector:
        text:
    expected_charge:
      name: Original enabled charge slots
      required: true
      selector:
        object:
    expected_discharge:
      name: Original enabled discharge slots
      required: true
      selector:
        object:
    proposed_charge:
      name: Proposed charging slots
      required: true
      selector:
        object:
    proposed_discharge:
      name: Proposed discharging slots
      required: true
      selector:
        object:
    entry_id:
      name: Optional control integration entry
      required: false
      selector:
        text:
