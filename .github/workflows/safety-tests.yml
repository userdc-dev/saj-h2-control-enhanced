name: Offline control safety checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax compile
        run: python -m compileall -q control_core custom_components bundled_components tests
      - name: Check dynamic dashboard JavaScript syntax
        run: node --check custom_components/saj_h2_control_enhanced/frontend/saj-tou-dynamic-card.js
      - name: Frontend behavior smoke tests (mocked HA, no inverter)
        run: node tests/test_frontend_smoke.cjs
      - name: Offline tests (never access inverter)
        run: |
          python -m unittest discover -s tests -p 'test_telemetry.py'
          python -m unittest discover -s tests -p 'test_tou_readback.py'
          python -m unittest discover -s tests -p 'test_ha_tou_protocol.py'
          python -m unittest discover -s tests -p 'test_reconciliation.py'
          python -m unittest discover -s tests -p 'test_mode_control_plan.py'
          python -m unittest discover -s tests -p 'test_supervised_mode_engine.py'
          python tests/test_safety_policy.py
          python -m unittest discover -s tests -p 'test_live_write_guard.py'
          python -m unittest discover -s tests -p 'test_schedule_preview.py'
          python -m unittest discover -s tests -p 'test_schedule_transaction.py'
          python -m unittest discover -s tests -p 'test_supervised_fallback.py'
          python -m unittest discover -s tests -p 'test_dashboard_title.py'
          python -m unittest discover -s tests -p 'test_package_and_ui.py'
          python -m unittest discover -s tests -p 'test_install_script.py'
          python -m unittest discover -s tests -p 'test_forecast_dashboard.py'
          python -m unittest discover -s tests -p 'test_forecast_calibration.py'
          python -m unittest discover -s tests -p 'test_forecast_runtime.py'
          python -m unittest discover -s tests -p 'test_energy_finance.py'
          python -m unittest discover -s tests -p 'test_tariffs.py'
          python -m unittest discover -s tests -p 'test_tariff_accounting.py'
          python -m unittest discover -s tests -p 'test_vpp_quick_preview.py'
          python -m unittest discover -s tests -p 'test_vpp_soc_readback.py'
          python -m unittest discover -s tests -p 'test_vpp_safety_supervisor.py'
      - name: Verify zero-YAML installer syntax
        run: bash -n scripts/install.sh
