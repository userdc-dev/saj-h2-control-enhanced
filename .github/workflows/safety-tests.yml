name: Offline control safety checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax compile
        run: python -m compileall -q control_core custom_components tests
      - name: Check dynamic dashboard JavaScript syntax
        run: node --check custom_components/saj_h2_control_enhanced/frontend/saj-tou-dynamic-card.js
      - name: Offline tests (never access inverter)
        run: |
          python -m unittest discover -s tests -p 'test_telemetry.py'
          python -m unittest discover -s tests -p 'test_tou_readback.py'
          python -m unittest discover -s tests -p 'test_ha_tou_protocol.py'
          python -m unittest discover -s tests -p 'test_reconciliation.py'
          python -m unittest discover -s tests -p 'test_mode_control_plan.py'
          python -m unittest discover -s tests -p 'test_supervised_mode_engine.py'
          python tests/test_safety_policy.py
      - name: Reject Modbus write implementations
        run: |
          if grep -R -nE '(write_registers?|write_coils?)\(' control_core custom_components --include='*.py'; then
            echo 'Write path detected in planning-only project'; exit 1
          fi
